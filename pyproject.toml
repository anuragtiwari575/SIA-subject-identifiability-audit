[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-audit"
version = "1.0.0"
description = "Subject Identifiability Auditing (SIA) for patient-level leakage in medical imaging benchmarks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Anurag Tiwari"}, {name = "Shailendra Tiwari"}]
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3",
  "scipy>=1.10", "Pillow>=9.0", "matplotlib>=3.7",
]

[project.scripts]
sia = "sia.cli:main"

[tool.setuptools.packages.find]
include = ["sia*"]
